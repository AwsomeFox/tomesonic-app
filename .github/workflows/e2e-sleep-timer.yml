name: E2E Sleep timer in background (Maestro + adb)

# The REAL test for "the sleep timer / end-of-chapter timer doesn't work":
# the app plays in the background — HOME, screen off, forced deep Doze —
# while the verdict is read from the live media session (dumpsys
# media_session), not from the (asleep) UI. See native/.maestro/ci-sleep-timer.sh
# for the scenarios and why each one exists.
#
# Runs on pull requests that touch the sleep timer / playback store / native
# player patch (path-filtered, so it is deliberately NOT a required check —
# a required check that path-skips would block unrelated PRs forever), nightly,
# and on demand. Minutes of real playback per scenario make it too slow to
# run on every PR.
on:
  workflow_dispatch:
  schedule:
    # 07:30 UTC nightly (after e2e-doze at 07:00).
    - cron: '30 7 * * *'
  pull_request:
    paths:
      - 'native/store/usePlaybackStore.ts'
      - 'native/store/playbackService.ts'
      - 'native/components/SleepTimerModal.tsx'
      - 'native/components/PlayerBottomSheet.tsx'
      - 'native/patches/react-native-track-player+*.patch'
      - 'native/.maestro/sleep/**'
      - 'native/.maestro/ci-sleep-timer.sh'
      - '.github/workflows/e2e-sleep-timer.yml'

concurrency:
  group: e2e-sleep-timer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: e2e-sleep-timer-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Reclaim ~20 GB of unused preinstalled toolchains so the NDK compile +
      # APK packaging have headroom (keep the Android SDK/NDK the build needs).
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY"/Ruby "$AGENT_TOOLSDIRECTORY"/PyPy || true
          df -h /

      - name: checkout sources
        uses: actions/checkout@v4

      - name: use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # SAME key as e2e-smoke / e2e-doze: .maestro/** is excluded from the
      # hash, so this rides whatever APK the regular e2e built for the tree.
      - name: cache built APK
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: native/android/app/build/outputs/apk/release/app-release.apk
          # Hash only the checkout-time source tree (see e2e-doze.yml: an
          # un-excluded 'native/**' blows the 120s hashFiles limit in the
          # post-step).
          key: e2e-apk-x86_64-${{ hashFiles('native/**', '!native/.maestro/**', '!native/node_modules/**', '!native/**/build/**', '!native/**/.cxx/**', '!native/android/.gradle/**') }}

      - name: ccache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: e2e-ndk-x86_64
          max-size: 1G

      - name: install dependencies
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix native

      - name: build release APK (x86_64 only)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        # RELEASE (debug loads JS from a Metro server the emulator doesn't
        # have); x86_64 only (the emulator's ABI — ~4x less native compile).
        working-directory: native/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew :app:assembleRelease --no-daemon -x lint -x test -PreactNativeArchitectures=x86_64

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sleep-timer-release-apk
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  e2e-sleep-timer:
    name: e2e-sleep-timer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY"/Ruby "$AGENT_TOOLSDIRECTORY"/PyPy || true
          df -h /

      - name: checkout sources
        uses: actions/checkout@v4

      - name: download APK
        uses: actions/download-artifact@v4
        with:
          name: e2e-sleep-timer-release-apk
          path: native/android/app/build/outputs/apk/release/

      - name: seed media fixture (The Sleep Book)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          # ONE m4b, ten 60s chapters, each [10s tone][40s SILENCE][10s tone]:
          # with Skip silence on, a chapter's 60s of POSITION plays in ~22s of
          # wall time — the gap that broke wall-clock end-of-chapter timers.
          # Chapters END on tone, so "paused at the end" is a real boundary.
          mkdir -p "$PWD/e2e-media/Test Author/The Sleep Book"
          cd "$PWD/e2e-media/Test Author/The Sleep Book"
          ffmpeg -loglevel error \
            -f lavfi -i "sine=frequency=440:duration=10" \
            -f lavfi -i "anullsrc=r=44100:cl=mono:d=40" \
            -f lavfi -i "sine=frequency=550:duration=10" \
            -filter_complex "[0][1][2]concat=n=3:v=0:a=1[a]" -map "[a]" chapter.wav
          {
            echo ";FFMETADATA1"
            echo "title=The Sleep Book"
            echo "artist=Test Author"
            echo "album=The Sleep Book"
            for i in $(seq 0 9); do
              echo "[CHAPTER]"
              echo "TIMEBASE=1/1000"
              echo "START=$((i * 60000))"
              echo "END=$(((i + 1) * 60000))"
              echo "title=Chapter $((i + 1))"
            done
          } > meta.txt
          ffmpeg -loglevel error -stream_loop 9 -i chapter.wav -i meta.txt \
            -map 0:a -map_metadata 1 -map_chapters 1 -c:a aac -b:a 64k sleep.m4b
          rm chapter.wav meta.txt
          ffprobe -loglevel error -show_entries format=duration -of csv=p=0 sleep.m4b
          ffprobe -loglevel error -show_chapters sleep.m4b | grep -c "\[CHAPTER\]"

      - name: start + provision Audiobookshelf
        run: |
          docker run -d --name abs -p 13378:80 \
            -v "$PWD/e2e-media":/media:ro \
            ghcr.io/advplyr/audiobookshelf:latest
          for i in $(seq 1 60); do
            curl -sf http://localhost:13378/status > /dev/null && break; sleep 2
          done
          curl -sf http://localhost:13378/status
          curl -sf -X POST http://localhost:13378/init \
            -H 'Content-Type: application/json' \
            -d '{"newRoot":{"username":"root","password":"testpass"}}'
          TOKEN=$(curl -sf -X POST http://localhost:13378/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"root","password":"testpass"}' | jq -r '.user.token')
          LIB=$(curl -sf -X POST http://localhost:13378/api/libraries \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"Test Library","folders":[{"fullPath":"/media"}],"mediaType":"book","provider":"custom"}' \
            | jq -r '.id')
          curl -sf -X POST "http://localhost:13378/api/libraries/$LIB/scan" \
            -H "Authorization: Bearer $TOKEN" || true
          for i in $(seq 1 60); do
            COUNT=$(curl -sf "http://localhost:13378/api/libraries/$LIB/items?limit=5" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.total // 0')
            [ "$COUNT" -ge 1 ] && break; sleep 2
          done
          echo "library items: $COUNT"
          [ "$COUNT" -ge 1 ]
          # The suite is meaningless without the ten embedded chapters.
          ITEM=$(curl -sf "http://localhost:13378/api/libraries/$LIB/items?limit=5" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.results[0].id')
          CH=$(curl -sf "http://localhost:13378/api/items/$ITEM" \
            -H "Authorization: Bearer $TOKEN" | jq '[.media.chapters[]?] | length')
          echo "The Sleep Book parsed chapters: $CH"
          [ "$CH" -ge 10 ]

      - name: install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run background sleep-timer scenarios on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Each script line runs in its own shell — keep it one command.
          script: bash native/.maestro/ci-sleep-timer.sh

      - name: upload maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-sleep-timer-debug
          path: |
            ~/.maestro/tests/
            ~/sleep-samples-all.log
          if-no-files-found: ignore
