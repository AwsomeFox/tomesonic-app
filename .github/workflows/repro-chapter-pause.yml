name: Repro - chapter boundary pause

# DIAGNOSTIC RIG, dispatch-only: reproduce "with some downloaded books
# playback paused at the end of each chapter" on a real emulator, before any
# fix is attempted. Clones e2e-smoke's two-job shape (same APK cache key, so
# a warm cache makes the build job ~2 min) but seeds BOTH suspect book
# shapes and runs ONLY the repro flow, which plays naturally across chapter
# boundaries — the one path the regular suite never exercises:
#
#  - "The Chapter Book": ONE m4b, three 25s EMBEDDED chapters → the
#    chapter-clipped queue (one clipped RNTP item per chapter).
#  - "The Test Book": TWO 30s mp3 files → the multi-file queue (ABS derives
#    a chapter per file).
#
# Logcat from the repro window uploads on success AND failure — the
# ExoPlayer/RNTP lines around each boundary are the point of the run.
on:
  workflow_dispatch:
  # API dispatch resolves workflow files against the DEFAULT branch, so a
  # branch-only rig can't be dispatched by name — self-trigger on the rig's
  # own files instead (the automotive-screenshots pattern): every rig tweak
  # pushed to the branch is a run.
  push:
    paths:
      - '.github/workflows/repro-chapter-pause.yml'
      - 'native/.maestro/repro/**'
      - 'native/.maestro/repro-chapter-pause.sh'

concurrency:
  group: repro-chapter-pause-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: repro-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY"/Ruby "$AGENT_TOOLSDIRECTORY"/PyPy || true
          df -h /

      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # SAME key as e2e-smoke: .maestro/** is excluded from the hash, so this
      # rig rides whatever APK the regular e2e already built for this tree.
      - name: cache built APK
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: native/android/app/build/outputs/apk/release/app-release.apk
          key: e2e-apk-x86_64-${{ hashFiles('native/**', '!native/.maestro/**') }}

      - name: ccache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: e2e-ndk-x86_64
          max-size: 1G

      - name: install dependencies
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix native

      - name: build release APK (x86_64 only)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: native/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew :app:assembleRelease --no-daemon -x lint -x test -PreactNativeArchitectures=x86_64

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: repro-release-apk
          path: native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  repro:
    name: repro-chapter-pause
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY"/Ruby "$AGENT_TOOLSDIRECTORY"/PyPy || true
          df -h /

      - name: checkout sources
        uses: actions/checkout@v3

      - name: download APK
        uses: actions/download-artifact@v4
        with:
          name: repro-release-apk
          path: native/android/app/build/outputs/apk/release/

      - name: seed media fixture (both suspect book shapes)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          # Multi-file shape: two SHORT files so natural playback crosses the
          # file boundary inside a CI-friendly wait (regular e2e uses 90s
          # files precisely because its flows never play through one).
          # Every chapter/file ENDS WITH 5s OF SILENCE, like real narration:
          # the silence-skipping audio processor (the app's "Skip silence"
          # setting, which the repro flow now turns ON) is maximally active at
          # exactly the boundaries under test — and androidx/media #1352
          # documents that processor faulting during playlist transitions.
          # Pure sine tails could never trigger it.
          mkdir -p "$PWD/e2e-media/Test Author/Test Series/1 - The Test Book"
          cd "$PWD/e2e-media/Test Author/Test Series/1 - The Test Book"
          ffmpeg -loglevel error \
            -f lavfi -i "sine=frequency=440:duration=25" \
            -f lavfi -i "anullsrc=r=44100:cl=mono:d=5" \
            -filter_complex "[0][1]concat=n=2:v=0:a=1[a]" -map "[a]" \
            -metadata title="Chapter 1" -metadata artist="Test Author" \
            -metadata album="The Test Book" track1.mp3
          ffmpeg -loglevel error \
            -f lavfi -i "sine=frequency=550:duration=25" \
            -f lavfi -i "anullsrc=r=44100:cl=mono:d=5" \
            -filter_complex "[0][1]concat=n=2:v=0:a=1[a]" -map "[a]" \
            -metadata title="Chapter 2" -metadata artist="Test Author" \
            -metadata album="The Test Book" track2.mp3
          # Chapter-queue shape: ONE m4b with three EMBEDDED 25s chapters.
          mkdir -p "$GITHUB_WORKSPACE/e2e-media/Test Author/The Chapter Book"
          cd "$GITHUB_WORKSPACE/e2e-media/Test Author/The Chapter Book"
          cat > meta.txt <<'EOF'
          ;FFMETADATA1
          title=The Chapter Book
          artist=Test Author
          album=The Chapter Book
          [CHAPTER]
          TIMEBASE=1/1000
          START=0
          END=25000
          title=Chapter 1
          [CHAPTER]
          TIMEBASE=1/1000
          START=25000
          END=50000
          title=Chapter 2
          [CHAPTER]
          TIMEBASE=1/1000
          START=50000
          END=75000
          title=Chapter 3
          EOF
          # The heredoc above is indented for YAML; ffmetadata is
          # whitespace-sensitive, so strip the leading spaces.
          sed -i 's/^[[:space:]]*//' meta.txt
          # 3 × (20s tone + 5s silence) = 75s, chapters at 0/25/50 — each
          # embedded-chapter clip boundary sits at the END of a silent tail.
          ffmpeg -loglevel error \
            -f lavfi -i "sine=frequency=330:duration=20" \
            -f lavfi -i "anullsrc=r=44100:cl=mono:d=5" \
            -f lavfi -i "sine=frequency=392:duration=20" \
            -f lavfi -i "anullsrc=r=44100:cl=mono:d=5" \
            -f lavfi -i "sine=frequency=262:duration=20" \
            -f lavfi -i "anullsrc=r=44100:cl=mono:d=5" \
            -i meta.txt \
            -filter_complex "[0][1][2][3][4][5]concat=n=6:v=0:a=1[a]" -map "[a]" \
            -map_metadata 6 -map_chapters 6 -c:a aac book.m4b
          rm meta.txt
          # Verify HERE, in this book's own directory — run 10 died because
          # this probe sat after the Long Book block's cd and ran in the
          # wrong cwd.
          ffprobe -loglevel error -show_chapters book.m4b | grep -c "\[CHAPTER\]"
          # THE REPORTED BOOK'S SHAPE: one m4b, 102 chapters (the reporter's
          # failing book is a single 1.64GB m4b with 102 chapters — scaled to
          # 102 × 7s). The chapter-storm flow streams it first (the reporter's
          # own failing case: their download had silently failed) and then
          # downloads it.
          mkdir -p "$GITHUB_WORKSPACE/e2e-media/Test Author/The Long Book"
          cd "$GITHUB_WORKSPACE/e2e-media/Test Author/The Long Book"
          {
            echo ";FFMETADATA1"
            echo "title=The Long Book"
            echo "artist=Test Author"
            echo "album=The Long Book"
            for i in $(seq 0 101); do
              echo "[CHAPTER]"
              echo "TIMEBASE=1/1000"
              echo "START=$((i * 7000))"
              echo "END=$(((i + 1) * 7000))"
              echo "title=Chapter $((i + 1))"
            done
          } > longmeta.txt
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=294:duration=714" \
            -i longmeta.txt -map_metadata 1 -map_chapters 1 -c:a aac long.m4b
          rm longmeta.txt
          ffprobe -loglevel error -show_chapters long.m4b | grep -c "\[CHAPTER\]"

      - name: start + provision Audiobookshelf
        run: |
          docker run -d --name abs -p 13378:80 \
            -v "$PWD/e2e-media":/media:ro \
            ghcr.io/advplyr/audiobookshelf:latest
          for i in $(seq 1 60); do
            curl -sf http://localhost:13378/status > /dev/null && break; sleep 2
          done
          curl -sf http://localhost:13378/status
          curl -sf -X POST http://localhost:13378/init \
            -H 'Content-Type: application/json' \
            -d '{"newRoot":{"username":"root","password":"testpass"}}'
          TOKEN=$(curl -sf -X POST http://localhost:13378/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"root","password":"testpass"}' | jq -r '.user.token')
          LIB=$(curl -sf -X POST http://localhost:13378/api/libraries \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"Test Library","folders":[{"fullPath":"/media"}],"mediaType":"book","provider":"custom"}' \
            | jq -r '.id')
          curl -sf -X POST "http://localhost:13378/api/libraries/$LIB/scan" \
            -H "Authorization: Bearer $TOKEN" || true
          # ALL THREE books must surface before the flow runs.
          for i in $(seq 1 60); do
            COUNT=$(curl -sf "http://localhost:13378/api/libraries/$LIB/items?limit=10" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.total // 0')
            [ "$COUNT" -ge 3 ] && break; sleep 2
          done
          echo "library items: $COUNT"
          [ "$COUNT" -ge 3 ]
          # The storm book is the point of the run — 102 parsed chapters or bust.
          LB=$(curl -sf "http://localhost:13378/api/libraries/$LIB/items?limit=10" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r '.results[] | select(.media.metadata.title=="The Long Book") | .id')
          LC=$(curl -sf "http://localhost:13378/api/items/$LB" \
            -H "Authorization: Bearer $TOKEN" | jq '[.media.chapters[]?] | length')
          echo "The Long Book parsed chapters: $LC"
          [ "$LC" -ge 102 ]
          # The repro is meaningless if ABS didn't parse the embedded
          # chapters — fail the seed loudly instead of green-passing a
          # chapterless single-file book (which builds a ONE-item queue with
          # no boundaries at all).
          ITEM=$(curl -sf "http://localhost:13378/api/libraries/$LIB/items?limit=10" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r '.results[] | select(.media.metadata.title=="The Chapter Book") | .id')
          CH=$(curl -sf "http://localhost:13378/api/items/$ITEM" \
            -H "Authorization: Bearer $TOKEN" | jq '[.media.chapters[]?] | length')
          echo "The Chapter Book parsed chapters: $CH"
          [ "$CH" -ge 3 ]
          # EVIDENCE, not an assert: print what ABS derived for the two-file
          # book. Runs 1-2 failed the "Chapter 1 of 2" caption on exactly this
          # book — whether the server session even CARRIES chapters decides
          # fixture-bug vs app-bug before reading a single app log.
          TB=$(curl -sf "http://localhost:13378/api/libraries/$LIB/items?limit=10" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -r '.results[] | select(.media.metadata.title=="The Test Book") | .id')
          echo "The Test Book chapters as ABS serves them:"
          curl -sf "http://localhost:13378/api/items/$TB" \
            -H "Authorization: Bearer $TOKEN" | jq '.media.chapters'

      - name: install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run repro flow on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash native/.maestro/repro-chapter-pause.sh

      # The logcat is the deliverable even on green: the boundary windows show
      # exactly what ExoPlayer did (transition reasons, state changes, errors).
      - name: capture device logcat
        if: always()
        # `timeout`: adb against a dead/never-booted emulator can BLOCK rather
        # than fail — run 1 hung here for 20+ minutes, wedging the artifact
        # upload behind it until the job was cancelled (which also discards
        # the step logs the run existed to produce).
        run: |
          timeout 90 adb -s emulator-5554 logcat -d > $HOME/full-logcat.txt || true
          grep -iE "ExoPlayer|RNTP|TrackPlayer|CONSOLE|ReactNativeJS|AndroidRuntime|FATAL|AudioTrack|MediaCodec" \
            $HOME/full-logcat.txt > $HOME/logcat-player.txt || true
          wc -l $HOME/full-logcat.txt $HOME/logcat-player.txt || true

      - name: upload repro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-debug
          path: |
            ~/.maestro/tests/
            ~/full-logcat.txt
            ~/logcat-player.txt
          if-no-files-found: ignore
