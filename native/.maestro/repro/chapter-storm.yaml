# REPRO, dimension 0 — the REPORTED BOOK'S SHAPE: one m4b, 102 chapters
# ("This Inevitable Ruin": single 1.64GB m4b, 102 chapters, 28h — scaled to
# 102 × 7s so boundaries arrive every ~5s at 1.5×). Two legs:
#
#   1. STREAMED: the reporting user's own failing case — their download had
#      silently failed, so the clipped queue ran over the HTTP source. Every
#      chapter transition re-opens the remote m4b (moov parse + ranged seek).
#   2. DOWNLOADED: the shape everyone else reports.
#
# Both at 1.5× with voice boost ON (set by enable-voice-boost.yaml) — the
# user's real conditions. 102 clipped items also stress the per-boundary
# metadata stamp/strip and the queue re-broadcasts far harder than the
# 3-chapter fixture ever did.
appId: com.tomesonic.app
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000

# ---- Leg 1: STREAMED at 1.5x ---------------------------------------------
- tapOn:
    text: "The Long Book by .*"
    index: 0
- extendedWaitUntil:
    visible: ".*(Play|Continue).*"
    timeout: 15000
# NOT downloaded yet — this play streams, like the reporter's failing case.
- tapOn: "^(Play|Continue)$"
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 30000
- extendedWaitUntil:
    visible: "Chapter 1 of 102"
    timeout: 15000
# 1.5x — the reported listening speed band. Persists into the download leg.
- tapOn: "Playback speed.*"
- extendedWaitUntil:
    visible: "1.5 times speed"
    timeout: 5000
- tapOn: "1.5 times speed"
- back
# Natural crossings: 7s chapters at 1.5x = a boundary every ~4.7s. Each
# assert pair = "the caption advanced AND the transport still plays".
- extendedWaitUntil:
    visible: "Chapter 2 of 102"
    timeout: 20000
- assertVisible: "Pause"
- extendedWaitUntil:
    visible: "Chapter 4 of 102"
    timeout: 25000
- assertVisible: "Pause"
- extendedWaitUntil:
    visible: "Chapter 6 of 102"
    timeout: 25000
- assertVisible: "Pause"
# Deep-queue jump: transitions late in a 102-item queue behave like early ones?
- tapOn: "Chapters and Up Next"
- scrollUntilVisible:
    element:
      text: "Chapter 60, starts at .*"
    direction: DOWN
    timeout: 30000
- tapOn: "Chapter 60, starts at .*"
- extendedWaitUntil:
    visible: "Chapter 60 of 102"
    timeout: 15000
- extendedWaitUntil:
    visible: "Chapter 61 of 102"
    timeout: 20000
- assertVisible: "Pause"
- tapOn: "Pause"
- assertVisible: "Play"
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Stop and close player"
    timeout: 5000
- tapOn: "Stop and close player"
- extendedWaitUntil:
    notVisible: "Expand player.*"
    timeout: 10000

# ---- Leg 2: DOWNLOADED at 1.5x -------------------------------------------
- extendedWaitUntil:
    visible: "Download"
    timeout: 15000
- tapOn: "Download"
- extendedWaitUntil:
    visible: "Delete download"
    timeout: 120000
- extendedWaitUntil:
    visible: ".*(Play|Continue).*"
    timeout: 15000
- tapOn: "^(Play|Continue)$"
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 30000
# Resumes around chapter 61 (leg 1's position). Jump deeper and cross there —
# well clear of the book end so auto-finish can't muddy the verdict.
- tapOn: "Chapters and Up Next"
- scrollUntilVisible:
    element:
      text: "Chapter 80, starts at .*"
    direction: DOWN
    timeout: 30000
- tapOn: "Chapter 80, starts at .*"
- extendedWaitUntil:
    visible: "Chapter 80 of 102"
    timeout: 15000
- extendedWaitUntil:
    visible: "Chapter 81 of 102"
    timeout: 20000
- assertVisible: "Pause"
- extendedWaitUntil:
    visible: "Chapter 83 of 102"
    timeout: 25000
- assertVisible: "Pause"
- tapOn: "Pause"
- assertVisible: "Play"
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Stop and close player"
    timeout: 5000
- tapOn: "Stop and close player"
- extendedWaitUntil:
    notVisible: "Expand player.*"
    timeout: 10000
