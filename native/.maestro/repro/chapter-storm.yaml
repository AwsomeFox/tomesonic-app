# REPRO, dimension 0 — the REPORTED BOOK'S SHAPE: one m4b, 102 chapters
# ("This Inevitable Ruin": single 1.64GB m4b, 102 chapters, 28h — scaled to
# 102 × 12s so boundaries arrive every ~8s at 1.5× without racing the taps,
# which is how run 12's 7s chapters broke the flow). Two legs:
#
#   1. STREAMED: the reporting user's own failing case — their download had
#      silently failed, so the clipped queue ran over the HTTP source. Every
#      chapter transition re-opens the remote m4b (moov parse + ranged seek).
#   2. DOWNLOADED: the shape everyone else reports.
#
# Both at 1.5× with voice boost ON (set by enable-voice-boost.yaml) — the
# user's real conditions. Caption asserts are PROGRESSION-shaped (regex
# floors, not exact chapters) so they can't go stale between taps.
appId: com.tomesonic.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
# Abort-safety: a flow that died mid-playback leaves a live session — and if
# its abort killed the app, Android's media resumption can RESTART it (run
# 12: the storm book auto-resumed and the next leg's Play tap hit ITS
# miniplayer). Stop whatever is playing; optional steps sail through when
# nothing is.
- runFlow:
    when:
      visible: "Expand player.*"
    commands:
      - tapOn: "Expand player.*"
      - tapOn: "More options"
      - extendedWaitUntil:
          visible: "Stop and close player"
          timeout: 5000
      - tapOn: "Stop and close player"

# ---- Leg 1: STREAMED at 1.5x ---------------------------------------------
- tapOn:
    text: "The Long Book by .*"
    index: 0
- extendedWaitUntil:
    visible: ".*(Play|Continue).*"
    timeout: 15000
# NOT downloaded yet — this play streams, like the reporter's failing case.
- tapOn: "^(Play|Continue)$"
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 30000
# Speed FIRST — before any caption assert (run 12 asserted first and never
# reached this tap). 1.5x is the reported listening band; it persists
# app-globally into the download leg.
- tapOn: "Playback speed.*"
- extendedWaitUntil:
    visible: "1.5 times speed"
    timeout: 5000
- tapOn: "1.5 times speed"
- back
# Progression asserts: any caption proves the clipped session is live; a
# two-digit chapter (10+) proves at least ~6 boundaries crossed WHILE STILL
# PLAYING. 12s chapters at 1.5x = one boundary per ~8s.
- extendedWaitUntil:
    visible: "Chapter \\d+ of 102"
    timeout: 15000
- extendedWaitUntil:
    visible: "Chapter \\d\\d of 102"
    timeout: 90000
- assertVisible: "Pause"
# Deep-queue jump: transitions late in a 102-item queue behave like early ones?
- tapOn: "Chapters and Up Next"
- scrollUntilVisible:
    element:
      text: "Chapter 60, starts at .*"
    direction: DOWN
    timeout: 30000
- tapOn: "Chapter 60, starts at .*"
- extendedWaitUntil:
    visible: "Chapter 6[01] of 102"
    timeout: 15000
- extendedWaitUntil:
    visible: "Chapter 6[2-9] of 102"
    timeout: 45000
- assertVisible: "Pause"
- tapOn: "Pause"
- assertVisible: "Play"
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Stop and close player"
    timeout: 5000
- tapOn: "Stop and close player"
- extendedWaitUntil:
    notVisible: "Expand player.*"
    timeout: 10000

# ---- Leg 2: DOWNLOADED at 1.5x -------------------------------------------
- extendedWaitUntil:
    visible: "Download"
    timeout: 15000
- tapOn: "Download"
- extendedWaitUntil:
    visible: "Delete download"
    timeout: 180000
- extendedWaitUntil:
    visible: ".*(Play|Continue).*"
    timeout: 15000
- tapOn: "^(Play|Continue)$"
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 30000
# Resumes around the leg-1 position. Jump deeper and cross there — well
# clear of the book end so auto-finish can't muddy the verdict.
- tapOn: "Chapters and Up Next"
- scrollUntilVisible:
    element:
      text: "Chapter 80, starts at .*"
    direction: DOWN
    timeout: 30000
- tapOn: "Chapter 80, starts at .*"
- extendedWaitUntil:
    visible: "Chapter 8[01] of 102"
    timeout: 15000
- extendedWaitUntil:
    visible: "Chapter 8[2-9] of 102"
    timeout: 45000
- assertVisible: "Pause"
- tapOn: "Pause"
- assertVisible: "Play"
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Stop and close player"
    timeout: 5000
- tapOn: "Stop and close player"
- extendedWaitUntil:
    notVisible: "Expand player.*"
    timeout: 10000
