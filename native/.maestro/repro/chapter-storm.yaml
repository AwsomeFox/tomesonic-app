# REPRO, dimension 0 — the REPORTED BOOK'S SHAPE: one m4b, 102 chapters
# ("This Inevitable Ruin": single 1.64GB m4b, 102 chapters, 28h — scaled to
# 102 × 12s so boundaries arrive every ~8s at 1.5×). Two legs:
#
#   1. STREAMED: the reporting user's own failing case — their download had
#      silently failed, so the clipped queue ran over the HTTP source. Every
#      chapter transition re-opens the remote m4b (moov parse + ranged seek).
#   2. DOWNLOADED: the shape everyone else reports.
#
# Both at 1.5× with voice boost ON (set by enable-voice-boost.yaml) — the
# user's real conditions. Caption asserts are PROGRESSION-shaped (regex
# floors, not exact chapters) so they can't go stale between taps.
#
# Run 13 verdict on this leg so far: 20 consecutive STREAMED transitions at
# exactly 8.00s apart (POS sampler), captions in lockstep — then the flow
# died in the chapters sheet: scrollUntilVisible "Chapter 60" managed ~8 rows
# in 30s because PlayerChaptersQueueSheet re-fires scrollToIndex(current-2)
# on every currentChapterIndex change, yanking the list back at each 8s
# boundary. The deep jump therefore no longer uses the sheet at all: a SKIP
# STORM of "Next chapter" taps (the same seekToChapter path the sheet rows
# call, and the path AVRCP next-track presses hit on Bluetooth — the
# reporter's real transport) drives deep into the queue, doubling as a
# rapid-seek stress against the reported "won't play again until killing the
# app" wedge. The natural-crossing proof afterwards needs no exact chapter:
# the "Chapter position" slider's a11y value counts elapsed WITHIN the
# chapter, so seeing a mid-chapter reading and then a low one again proves a
# boundary was crossed by playback itself, whatever its number.
appId: com.tomesonic.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
# Abort-safety, three states (run 13 proved the miniplayer-only version
# insufficient — the app can resume ON the full player, chapters sheet open,
# where "Expand player.*" doesn't exist and the bare "Home" text still
# matches). Order matters: dismiss the sheet, then stop from the full
# player, then the miniplayer case; optional steps sail through when
# nothing is playing.
- runFlow:
    when:
      visible: "Dismiss chapters and queue list"
    commands:
      - tapOn: "Dismiss chapters and queue list"
- runFlow:
    when:
      visible: "Collapse player"
    commands:
      - tapOn: "More options"
      - extendedWaitUntil:
          visible: "Stop and close player"
          timeout: 5000
      - tapOn: "Stop and close player"
      - extendedWaitUntil:
          notVisible: "Collapse player"
          timeout: 10000
- runFlow:
    when:
      visible: "Expand player.*"
    commands:
      - tapOn: "Expand player.*"
      - tapOn: "More options"
      - extendedWaitUntil:
          visible: "Stop and close player"
          timeout: 5000
      - tapOn: "Stop and close player"

# ---- Leg 1: STREAMED at 1.5x ---------------------------------------------
- tapOn:
    text: "The Long Book by .*"
    index: 0
- extendedWaitUntil:
    visible: ".*(Play|Continue).*"
    timeout: 15000
# NOT downloaded yet — this play streams, like the reporter's failing case.
- tapOn: "^(Play|Continue)$"
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 30000
# Speed FIRST — before any caption assert (run 12 asserted first and never
# reached this tap). 1.5x is the reported listening band; it persists
# app-globally into the download leg.
- tapOn: "Playback speed.*"
- extendedWaitUntil:
    visible: "1.5 times speed"
    timeout: 5000
- tapOn: "1.5 times speed"
- back
# Progression asserts: any caption proves the clipped session is live; a
# two-digit chapter (10+) proves at least ~6 boundaries crossed WHILE STILL
# PLAYING. 12s chapters at 1.5x = one boundary per ~8s.
- extendedWaitUntil:
    visible: "Chapter \\d+ of 102"
    timeout: 15000
- extendedWaitUntil:
    visible: "Chapter \\d\\d of 102"
    timeout: 90000
- assertVisible: "Pause"
# SKIP STORM: 45 rapid seekToChapter(+1)s through the clipped queue. From
# chapter ≥10 this lands ≥40 even if a few taps read the same active index
# and coalesce; nextChapter() no-ops at the queue end, so overshoot is safe.
- repeat:
    times: 45
    commands:
      - tapOn: "Next chapter"
# Deep in the queue AND still playing after the storm.
- extendedWaitUntil:
    visible: "Chapter [4-9]\\d of 102"
    timeout: 10000
- assertVisible: "Pause"
# Natural-crossing proof: anchor mid-chapter (elapsed 5-9s of the 12s
# chapter), then require a low reading again — only playback itself crossing
# a boundary can wrap the counter, no taps are happening. 8s wall per
# chapter at 1.5x, so 15s timeouts cover any phase.
- extendedWaitUntil:
    visible: "Chapter position, 0:0[5-9] elapsed.*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Chapter position, 0:0[0-3] elapsed.*"
    timeout: 15000
- assertVisible: "Pause"
- tapOn: "Pause"
- assertVisible: "Play"
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Stop and close player"
    timeout: 5000
- tapOn: "Stop and close player"
- extendedWaitUntil:
    notVisible: "Expand player.*"
    timeout: 10000

# ---- Leg 2: DOWNLOADED at 1.5x -------------------------------------------
- extendedWaitUntil:
    visible: "Download"
    timeout: 15000
- tapOn: "Download"
- extendedWaitUntil:
    visible: "Delete download"
    timeout: 180000
- extendedWaitUntil:
    visible: ".*(Play|Continue).*"
    timeout: 15000
- tapOn: "^(Play|Continue)$"
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 30000
- extendedWaitUntil:
    visible: "Chapter \\d+ of 102"
    timeout: 15000
# Resumes around where leg 1 stopped (~ch55-65). A shorter storm keeps the
# landing well clear of chapter 102, where end-of-book auto-finish could
# legitimately stop playback and read as a false red.
- repeat:
    times: 15
    commands:
      - tapOn: "Next chapter"
- extendedWaitUntil:
    visible: "Chapter ([5-9]\\d|10[0-2]) of 102"
    timeout: 10000
- assertVisible: "Pause"
- extendedWaitUntil:
    visible: "Chapter position, 0:0[5-9] elapsed.*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Chapter position, 0:0[0-3] elapsed.*"
    timeout: 15000
- assertVisible: "Pause"
- tapOn: "Pause"
- assertVisible: "Play"
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Stop and close player"
    timeout: 5000
- tapOn: "Stop and close player"
- extendedWaitUntil:
    notVisible: "Expand player.*"
    timeout: 10000
