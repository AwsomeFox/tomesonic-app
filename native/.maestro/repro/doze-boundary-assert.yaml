# REPRO, dimension 2, phase 2: the wake-side judgment. Runs after the runner
# verified the device actually reached deep idle (deviceidle get deep ==
# IDLE) and slept 15s across the downloaded 102-chapter book's 12s
# boundaries (~2 crossings at the app-global 1.5x).
#
# The invariant is playback SURVIVED the idled crossings: the session is
# live with the transport still playing. A boundary halt flips the
# transport to "Play" (or kills the caption) — either goes red here — and
# the runner's STOPPED-fingerprint gate on the POS sampler catches the
# same halt deterministically; the sampler's timeline is the record of the
# crossings themselves (run 7/16 style). No pinned chapter numbers: run 18
# retired the 75s fixture whose end raced the assert at 1.5x.
#
# See doze-boundary-start.yaml for why the two phases are separate files.
appId: com.tomesonic.app
---
# Bring the app forward WITHOUT killing it: Maestro's launchApp stops the
# target app by default, and run 7's sampler caught exactly that — playback
# had crossed both boundaries ON SCHEDULE through verified deep idle, then
# died 4s after this phase launched, at the harness's own hand.
- launchApp:
    stopApp: false
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 20000
- extendedWaitUntil:
    visible: "Chapter \\d+ of 102"
    timeout: 15000
- assertVisible: "Pause"
