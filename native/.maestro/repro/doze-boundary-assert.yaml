# REPRO, dimension 2, phase 2: the wake-side judgment. Runs after the runner
# verified the device actually reached deep idle (deviceidle get deep == IDLE)
# and slept ~30s across the 25s chapter boundary from ~Chapter1+5s.
#
# A boundary pause shows "Chapter 1 of 3" forever (never crossed) or "Play"
# over Chapter 2 (crossed, then paused) — either goes red here.
#
# See doze-boundary-start.yaml for why the two phases are separate files.
appId: com.tomesonic.app
---
# Bring the app forward WITHOUT killing it: Maestro's launchApp stops the
# target app by default, and run 7's sampler caught exactly that — playback
# had crossed both boundaries ON SCHEDULE through verified deep idle, then
# died 4s after this phase launched, at the harness's own hand.
- launchApp:
    stopApp: false
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 20000
# Timing-proof invariant: a boundary was crossed AND playback is still
# running. Pinning a single chapter made the assert a stopwatch (the sandwich
# overhead put run 7 in chapter 3, not 2).
- extendedWaitUntil:
    visible: "Chapter [23] of 3"
    timeout: 15000
- assertVisible: "Pause"
