# REPRO, dimension 2, phase 1: pin the downloaded m4b to the top of
# Chapter 1, playing. The runner then force-idles the emulator across the 25s
# chapter boundary and runs doze-boundary-assert.yaml.
#
# TWO FILES, deliberately not one PHASE-switched file: current Maestro applies
# a flow's `env:` DEFAULTS over CLI `-e` overrides (proven in run 5 — the
# `-e PHASE=assert` invocation re-ran the start phase), so a defaulted
# selector variable is a silent no-op switch. Separate files can't misroute.
#
# The foreground legs (chapter-pause.yaml) run first and leave this book
# stopped/finished — the chapters-sheet jump makes the starting position
# deterministic regardless.
appId: com.tomesonic.app
---
# stopApp: false + abort-safety preamble — see chapter-pause.yaml: a killed
# app resurrects its session via Android media resumption, and a leftover
# live session steals the bare Play tap below.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
# Three-state teardown (see chapter-pause.yaml): sheet open → full player →
# miniplayer; a predecessor can die in any of them.
- runFlow:
    when:
      visible: "Dismiss chapters and queue list"
    commands:
      - tapOn: "Dismiss chapters and queue list"
- runFlow:
    when:
      visible: "Collapse player"
    commands:
      - tapOn: "More options"
      - extendedWaitUntil:
          visible: "Stop and close player"
          timeout: 5000
      - tapOn: "Stop and close player"
      - extendedWaitUntil:
          notVisible: "Collapse player"
          timeout: 10000
- runFlow:
    when:
      visible: "Expand player.*"
    commands:
      - tapOn: "Expand player.*"
      - tapOn: "More options"
      - extendedWaitUntil:
          visible: "Stop and close player"
          timeout: 5000
      - tapOn: "Stop and close player"
# With stopApp:false no flow starts from a known screen — a predecessor (or
# the preamble's stop-and-close) leaves the app on an ITEM PAGE, where no
# library row exists (run 14). Pop back toward Home if the target book
# isn't visible; launchApp re-foregrounds if back ran on Home's root.
- runFlow:
    when:
      notVisible: "The Chapter Book by .*"
    commands:
      - back
      - launchApp:
          stopApp: false
      - extendedWaitUntil:
          visible: "Home"
          timeout: 10000

- tapOn:
    text: "The Chapter Book by .*"
    index: 0
- extendedWaitUntil:
    visible: ".*(Play|Continue).*"
    timeout: 15000
- tapOn: "^(Play|Continue)$"
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 30000
# Deterministic anchor: jump to Chapter 1's top regardless of what the
# earlier legs left as this book's saved position / finished flag.
- tapOn: "Chapters and Up Next"
- extendedWaitUntil:
    visible: "Chapter 1, starts at .*"
    timeout: 5000
- tapOn: "Chapter 1, starts at .*"
- extendedWaitUntil:
    visible: "Chapter 1 of 3"
    timeout: 10000
# Playing, not paused, when the screen goes dark.
- assertVisible: "Pause"
