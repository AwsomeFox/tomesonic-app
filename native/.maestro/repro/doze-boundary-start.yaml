# REPRO, dimension 2, phase 1: put the DOWNLOADED 102-chapter m4b in a
# playing state. The runner then force-idles the emulator across its 12s
# chapter boundaries (~8s wall at the app-global 1.5x) and runs
# doze-boundary-assert.yaml.
#
# The Long Book replaced the 75s Chapter Book here after run 18: at 1.5x
# the small book's whole content lasts 50s of wall time, and the doze
# sandwich plus assert-launch overhead runs ~50s from the chapter-1 pin —
# run 16 won that race by ~2s, run 18 lost it by ~2s (the last chapter
# played out and pushed STOPPED five seconds before the Pause assert). On
# the 102-chapter book the end is minutes away from any resume point the
# earlier legs can leave, so no pin is needed: the flow just requires the
# session live and PLAYING before the screen goes dark, and the POS
# sampler plus the runner's STOPPED-fingerprint gate judge the crossings
# made while idled.
#
# TWO FILES, deliberately not one PHASE-switched file: current Maestro
# applies a flow's `env:` DEFAULTS over CLI `-e` overrides (proven in run
# 5), so a defaulted selector variable is a silent no-op switch. Separate
# files can't misroute.
appId: com.tomesonic.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
# Three-state teardown (see chapter-pause.yaml): sheet open → full player →
# miniplayer; a predecessor can die in any of them.
- runFlow:
    when:
      visible: "Dismiss chapters and queue list"
    commands:
      - tapOn: "Dismiss chapters and queue list"
- runFlow:
    when:
      visible: "Collapse player"
    commands:
      - tapOn: "More options"
      - extendedWaitUntil:
          visible: "Stop and close player"
          timeout: 5000
      - tapOn: "Stop and close player"
      - extendedWaitUntil:
          notVisible: "Collapse player"
          timeout: 10000
- runFlow:
    when:
      visible: "Expand player.*"
    commands:
      - tapOn: "Expand player.*"
      - tapOn: "More options"
      - extendedWaitUntil:
          visible: "Stop and close player"
          timeout: 5000
      - tapOn: "Stop and close player"
# Pop toward Home when the target book isn't visible — dimension 1 leaves
# the app on The Test Book's item page.
- runFlow:
    when:
      notVisible: "The Long Book by .*"
    commands:
      - back
      - launchApp:
          stopApp: false
      - extendedWaitUntil:
          visible: "Home"
          timeout: 10000
- scrollUntilVisible:
    element:
      text: "The Long Book by .*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "The Long Book by .*"
    index: 0
- extendedWaitUntil:
    visible: ".*(Play|Continue).*"
    timeout: 15000
# Downloaded by the storm leg — this resumes the LOCAL copy, somewhere deep.
- tapOn: "^(Play|Continue)$"
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 30000
- extendedWaitUntil:
    visible: "Chapter \\d+ of 102"
    timeout: 15000
# Playing, not paused, when the screen goes dark.
- assertVisible: "Pause"
