# TOGGLE the "Skip silence" setting (lands ON in CI: 10-login just launched
# with cleared state, so the setting starts at its OFF default — a LOCAL
# re-run against a warm install flips it back OFF). Kept for on-demand use;
# the pipeline no longer runs it: run 9 tested this condition and it PASSED,
# and the reporting user has skip silence off. Original hypothesis, for the
# record: skip-silence routes audio through media3's
# SilenceSkippingAudioProcessor, which androidx/media #1352 documents faulting
# during PLAYLIST TRANSITIONS — and the chapter-clipped queue makes every
# chapter end of a downloaded book a playlist transition, landing exactly on
# the silent tail real narration leaves there. The default-settings runs
# (1-8) could never exercise this path.
#
# Row taps toggle (50-downloads-settings.yaml proves the pattern).
appId: com.tomesonic.app
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
- tapOn: "Account menu"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: ".*Settings.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Skip silence"
    direction: DOWN
    timeout: 15000
- tapOn: "Skip silence"
- back
- assertVisible: "Home"
