# Sleep suite: arm "End of chapter" while playing, then collapse to the
# miniplayer — the runner takes the screen off / dozes from here.
appId: com.tomesonic.app
---
- tapOn: "Sleep timer"
- extendedWaitUntil:
    visible: "End of chapter"
    timeout: 5000
- tapOn: "End of chapter"
- extendedWaitUntil:
    visible: "Sleep timer, .* remaining"
    timeout: 5000
- tapOn: "Collapse player"
- extendedWaitUntil:
    visible: "Expand player.*"
    timeout: 10000
