# Sleep suite: arm a FIXED 1-minute timer through the Custom stepper (15 → 1),
# then collapse. The runner backgrounds the app (HOME) right after.
appId: com.tomesonic.app
---
- tapOn: "Sleep timer"
- extendedWaitUntil:
    visible: "Custom"
    timeout: 5000
- tapOn: "Custom"
- extendedWaitUntil:
    visible: "Decrease minutes"
    timeout: 5000
- repeat:
    times: 14
    commands:
      - tapOn: "Decrease minutes"
- assertVisible: "1 min"
- tapOn: "Set Timer"
- extendedWaitUntil:
    visible: "Sleep timer, .* remaining"
    timeout: 5000
- tapOn: "Collapse player"
- extendedWaitUntil:
    visible: "Expand player.*"
    timeout: 10000
