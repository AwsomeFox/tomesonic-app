# Sleep suite: arm "Stop after chapter…" for -e TARGET="Chapter N" (no env
# default, see jump.yaml), then collapse.
appId: com.tomesonic.app
---
- tapOn: "Sleep timer"
- extendedWaitUntil:
    visible: "Stop after chapter.*"
    timeout: 5000
- tapOn: "Stop after chapter.*"
- scrollUntilVisible:
    element:
      text: "Stop after ${TARGET}, ends in .*"
    direction: DOWN
    timeout: 10000
- tapOn: "Stop after ${TARGET}, ends in .*"
- extendedWaitUntil:
    visible: "Sleep timer, .* remaining"
    timeout: 5000
- tapOn: "Collapse player"
- extendedWaitUntil:
    visible: "Expand player.*"
    timeout: 10000
