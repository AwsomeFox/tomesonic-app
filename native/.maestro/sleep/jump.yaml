# Sleep suite: jump to a KNOWN chapter start (absolute — resume's
# rewind-on-wake / auto-rewind make the resume point approximate), while
# PLAYING, BEFORE the timer is armed. Run with -e CHAPTER="Chapter N" (no env
# default on purpose: Maestro applies flow defaults OVER -e overrides).
appId: com.tomesonic.app
---
- tapOn: "Chapters and Up Next"
- scrollUntilVisible:
    element:
      text: "${CHAPTER}, starts at .*"
    direction: DOWN
    timeout: 15000
- tapOn: "${CHAPTER}, starts at .*"
- tapOn:
    text: "Dismiss chapters and queue list"
    optional: true
- extendedWaitUntil:
    visible: "${CHAPTER} of 10"
    timeout: 10000
- assertVisible: "Pause"
