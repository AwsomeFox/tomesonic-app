# Sleep suite: bring the app back after a scenario and check the JS side
# mirrored the NATIVE pause (abs-sleep-fired): paused, countdown chip gone.
# Then resume playback for the next scenario. stopApp:false — Maestro's
# launchApp kills the app by default, destroying the very state under test.
appId: com.tomesonic.app
---
- launchApp:
    stopApp: false
- tapOn:
    text: "Expand player.*"
    optional: true
- extendedWaitUntil:
    visible: "Collapse player"
    timeout: 20000
- assertVisible: "Play"
- assertNotVisible: "Sleep timer, .* remaining"
- assertVisible: "Sleep timer"
- tapOn: "Play"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 15000
