apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

// Pure-native Android Automotive OS app. Lives OUTSIDE native/android (which
// `expo prebuild --clean` deletes); wired in by settings.gradle + the
// withAutomotiveApp config plugin. Contract: native/automotive/ARCHITECTURE.md.
//
// No Compose plugin here, unlike :wear — the car's Media Center draws browse
// and now-playing, and the only app-drawn screens this module will ever ship
// (sign-in and settings, Wave 4) are plain views.

// rootProject.ext is populated by the expo-root-project plugin applied at the
// bottom of ../android/build.gradle. Same helper shape as app/build.gradle.
def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// versionCode/versionName are DERIVED from the phone app so the release
// workflow's single stamp of app/build.gradle (native/scripts/set-version.mjs)
// covers the car too — nothing extra to bump. +2_000_000 sits above the watch's
// +1_000_000 band, giving the one Play listing three monotonic, non-colliding
// ranges from one stamp (phone 20154 -> wear 1020154 -> automotive 2020154).
def phoneBuildGradle = file("../android/app/build.gradle")
if (!phoneBuildGradle.exists()) {
  throw new GradleException(
    ":automotive cannot derive its version — ${phoneBuildGradle.absolutePath} is missing " +
    "(run `npx expo prebuild` in native/ first)."
  )
}
def phoneBuildGradleText = phoneBuildGradle.getText("UTF-8")
def phoneCodeMatcher = phoneBuildGradleText =~ /versionCode\s+(\d+)/
if (!phoneCodeMatcher.find()) {
  throw new GradleException(
    ":automotive cannot derive its versionCode — no `versionCode <n>` in ${phoneBuildGradle.absolutePath}."
  )
}
def phoneNameMatcher = phoneBuildGradleText =~ /versionName\s+"([^"]+)"/
if (!phoneNameMatcher.find()) {
  throw new GradleException(
    ":automotive cannot derive its versionName — no `versionName \"<x>\"` in ${phoneBuildGradle.absolutePath}."
  )
}
def automotiveVersionCode = phoneCodeMatcher.group(1).toInteger() + 2_000_000
def automotiveVersionName = phoneNameMatcher.group(1)

android {
    namespace 'com.tomesonic.app.automotive'
    compileSdk safeExtGet('compileSdkVersion', 36)
    buildToolsVersion safeExtGet('buildToolsVersion', '36.0.0')

    defaultConfig {
        // MUST equal the phone app: same Play listing (Google's strong
        // recommendation for a car build), same as :wear does.
        applicationId 'com.tomesonic.app'
        // Every shipping AAOS head unit runs Android 9 or newer.
        minSdkVersion 28
        // PINNED LITERALLY, like :wear's 35 and for the same reason: Play's
        // target-API policy carves Android Automotive OS out at 35 while mobile
        // moves to 36 (2026-08-31), so a phone-driven targetSdk bump must not
        // silently change car behaviour. Do not replace with safeExtGet.
        targetSdkVersion 35
        versionCode automotiveVersionCode
        versionName automotiveVersionName
    }
    signingConfigs {
        debug {
            // The phone app's debug keystore. Same applicationId as the phone
            // build, so a car debug APK must carry the SAME signature — an
            // `adb install` of a differently-signed build onto a head unit that
            // already has the phone app fails outright.
            storeFile rootProject.file("app/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Play upload key — provided by the deploy workflow via -P props.
            // Absent props (local / e2e builds) leave this config empty and the
            // buildType below falls back to debug signing.
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                // The workflow passes a bare filename and drops the keystore in
                // android/app/ — resolve it there, NOT against this module's
                // dir (same exception :wear carries).
                def uploadStore = new File(MYAPP_UPLOAD_STORE_FILE)
                storeFile uploadStore.isAbsolute() ? uploadStore : new File(rootProject.file("app"), MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Same conditional as :app and :wear — signed with the upload key
            // when the deploy workflow passes it, debug-signed otherwise so
            // local and e2e builds need no keystore.
            signingConfig project.hasProperty('MYAPP_UPLOAD_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            // R8 off, same as :wear: the car app is small and no keep rules
            // exist yet for the media3 browse/session surface.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests {
            // Robolectric tests (src/test) need the module's packaged resources.
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Tracks the root project's kotlin pin (RN's version catalog via
    // expo-root-project) rather than a literal, so an RN bump can't leave
    // :automotive compiling against a stale stdlib.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '2.1.20')}"
    // core only, deliberately: like :wear, nothing here needs a Main dispatcher
    // from coroutines-android — Service.mainExecutor.asCoroutineDispatcher()
    // covers the one place media3 demands the main thread.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'

    implementation 'androidx.core:core-ktx:1.13.1'
    // Creds store (Wave 2) — same artifact and version :wear uses.
    implementation 'androidx.datastore:datastore-preferences:1.1.7'

    // media3 — the SAME 1.8.0 line :wear and the patched RNTP service already
    // resolve to. MediaLibraryService is this module's entire app surface.
    implementation 'androidx.media3:media3-common:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'

    // JVM unit tests (src/test). Versions identical to :app and :wear — the
    // robolectric one is mirrored in .github/workflows/android-unit-tests.yml
    // (android-all jar cache key); bump all three together.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    // ApplicationProvider (androidx.test.core.app) — the only androidx.test
    // artifact the tests import.
    testImplementation 'androidx.test:core:1.6.1'

    // Wave 2 data layer. Same artifact and version :wear pins: AbsClient is an
    // OkHttp client + interceptor, and HttpUrl is what its origin check (and
    // AbsClientOriginTest) compares scheme/host/port on. An `implementation`
    // dep is on the unit-test compile classpath too, so the tests need no
    // second line — and the data tests deliberately add no coroutine-test or
    // MockWebServer dependency, exactly as :wear's don't.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Wave 3B downloads. The SAME coordinate and version :wear pins — the whole
    // downloads package is that module's, and the transfer is a CoroutineWorker
    // whose constraints, retry backoff and reboot persistence are the reason
    // WorkManager is here rather than a service of our own. `implementation`
    // puts WorkInfo.State on the unit-test compile classpath too, which is all
    // DownloadRepositoryTest's status-fold table needs — `work-testing` stays
    // deliberately absent, exactly as on :wear.
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
}
