apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

// Pure-native Wear OS app. Lives OUTSIDE native/android (which
// `expo prebuild --clean` deletes); wired in by settings.gradle + the
// withWearApp config plugin. Contract: native/wear/ARCHITECTURE.md.

// rootProject.ext is populated by the expo-root-project plugin applied at the
// bottom of ../android/build.gradle. Same helper shape as app/build.gradle.
def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// versionCode/versionName are DERIVED from the phone app so the release
// workflow's single stamp of app/build.gradle (native/scripts/set-version.mjs)
// covers the watch too — nothing extra to bump. +1_000_000 keeps the wear
// artifact's code distinct from (and above) the phone's inside the one Play
// listing, which Play requires of same-package uploads.
def phoneBuildGradle = file("../android/app/build.gradle")
if (!phoneBuildGradle.exists()) {
  throw new GradleException(
    ":wear cannot derive its version — ${phoneBuildGradle.absolutePath} is missing " +
    "(run `npx expo prebuild` in native/ first)."
  )
}
def phoneBuildGradleText = phoneBuildGradle.getText("UTF-8")
def phoneCodeMatcher = phoneBuildGradleText =~ /versionCode\s+(\d+)/
if (!phoneCodeMatcher.find()) {
  throw new GradleException(
    ":wear cannot derive its versionCode — no `versionCode <n>` in ${phoneBuildGradle.absolutePath}."
  )
}
def phoneNameMatcher = phoneBuildGradleText =~ /versionName\s+"([^"]+)"/
if (!phoneNameMatcher.find()) {
  throw new GradleException(
    ":wear cannot derive its versionName — no `versionName \"<x>\"` in ${phoneBuildGradle.absolutePath}."
  )
}
def wearVersionCode = phoneCodeMatcher.group(1).toInteger() + 1_000_000
def wearVersionName = phoneNameMatcher.group(1)

android {
    namespace 'com.tomesonic.app.wear'
    compileSdk safeExtGet('compileSdkVersion', 35)
    buildToolsVersion safeExtGet('buildToolsVersion', '35.0.0')

    defaultConfig {
        // MUST equal the phone app: same Play listing, and the Wearable Data
        // Layer only pairs same-package, same-signature apps.
        applicationId 'com.tomesonic.app'
        minSdkVersion 30 // Wear OS 3+
        targetSdkVersion 35
        versionCode wearVersionCode
        versionName wearVersionName
    }
    signingConfigs {
        debug {
            // The phone app's debug keystore — a debug watch build must carry
            // the SAME signature as the debug phone build or the Data Layer
            // refuses to pair them.
            storeFile rootProject.file("app/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Play upload key — provided by the deploy workflow via -P props.
            // Absent props (local / e2e builds) leave this config empty and the
            // buildType below falls back to debug signing.
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                // The workflow passes a bare filename and drops the keystore in
                // android/app/ — resolve it there, NOT against this module's
                // dir (the one place :wear can't mirror :app verbatim).
                def uploadStore = new File(MYAPP_UPLOAD_STORE_FILE)
                storeFile uploadStore.isAbsolute() ? uploadStore : new File(rootProject.file("app"), MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Same conditional as :app — signed with the upload key when the
            // deploy workflow passes it, debug-signed otherwise so local and
            // e2e builds need no keystore.
            signingConfig project.hasProperty('MYAPP_UPLOAD_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            // v1 keeps R8 off: the watch app is small and no keep rules exist
            // yet for media3/play-services reflection. Shrink later, once the
            // playback and Data Layer classes are in and testable.
            minifyEnabled false
        }
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests {
            // Robolectric tests (src/test) need the module's packaged resources.
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Versions are pinned in native/wear/ARCHITECTURE.md — do not drift them
    // here without updating that table.
    implementation platform('androidx.compose:compose-bom:2025.05.00')
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'

    // Wear Compose is versioned independently of the BOM.
    implementation 'androidx.wear.compose:compose-material3:1.5.0'
    implementation 'androidx.wear.compose:compose-foundation:1.5.0'
    implementation 'androidx.wear.compose:compose-navigation:1.5.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'

    // media3 — same version as RNTP uses on the phone.
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-common:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Wearable Data Layer (creds arrive from the phone) + await() on its Tasks.
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.1'

    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-ongoing:1.0.0'

    // v2: tile + complication + on-watch input. protolayout-material is the
    // M2.5 component set ON PURPOSE — protolayout-material3 has no stable
    // release, so the tile takes its colors from ui/theme/Color.kt instead.
    implementation 'androidx.wear.tiles:tiles:1.6.2'
    implementation 'androidx.wear.protolayout:protolayout:1.4.2'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.4.2'
    implementation 'androidx.wear.protolayout:protolayout-material:1.4.2'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0'
    implementation 'androidx.wear:wear-input:1.1.0'
    // SuspendToFutureAdapter — TileService speaks ListenableFuture, the app
    // speaks coroutines.
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.2.0'

    // JVM unit tests (src/test). Versions identical to :app — the robolectric
    // one is mirrored in .github/workflows/android-unit-tests.yml (android-all
    // jar cache key); bump all three together.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    // ApplicationProvider (androidx.test.core.app) — the only androidx.test
    // artifact the tests import.
    testImplementation 'androidx.test:core:1.6.1'
}
